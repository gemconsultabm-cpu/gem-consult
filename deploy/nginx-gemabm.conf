# GEM Consult — bloc nginx (reverse proxy) pour gemabm.com → conteneur Next.js (127.0.0.1:3010)
# À adapter au fichier existant de l'ancien site : en général, seule la ligne « proxy_pass » change.
upstream gemabm_next { server 127.0.0.1:3010; keepalive 16; }

server {
    listen 80;
    server_name gemabm.com www.gemabm.com;
    return 301 https://gemabm.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name gemabm.com www.gemabm.com;

    # Certificats existants (certbot) — conserver ceux de l'ancien site
    ssl_certificate     /etc/letsencrypt/live/gemabm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gemabm.com/privkey.pem;

    if ($host = www.gemabm.com) { return 301 https://gemabm.com$request_uri; }

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1m;
    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;

    location / {
        proxy_pass http://gemabm_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;                    # IP réelle (limitation anti-abus des formulaires et de l'assistant)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    # Fichiers statiques versionnés : mis en cache longtemps
    location /_next/static/ { proxy_pass http://gemabm_next; expires 365d; add_header Cache-Control "public, immutable"; }
    # Administration : les tâches IA lancées à la main durent jusqu'à 3 minutes
    location /admin { proxy_pass http://gemabm_next; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 420s; }
    # Les tâches planifiées passent par le réseau Docker interne, jamais par Internet
    location /api/cron/ { return 404; }
}
